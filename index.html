<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promesse Éternelle - Share Your Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-ivory: #faf9f6;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa771c;
            --text-dark: #333333;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }

        /* Classy Sparkles & Glowing Background Animation */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-ivory);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(170, 119, 28, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(243, 229, 171, 0.15) 0%, transparent 60%);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Sparkle Effects floating around */
        body::before {
            content: "✨";
            position: fixed;
            top: 10%;
            left: 5%;
            font-size: 20px;
            opacity: 0.4;
            animation: floatSparkle 4s ease-in-out infinite alternate;
            z-index: -1;
        }
        body::after {
            content: "✨";
            position: fixed;
            bottom: 15%;
            right: 8%;
            font-size: 24px;
            opacity: 0.4;
            animation: floatSparkle 5s ease-in-out infinite alternate-reverse;
            z-index: -1;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            100% { transform: translateY(-15px) rotate(15deg); opacity: 0.7; }
        }

        .form-container {
            background: var(--white);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--gold-light);
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-dark);
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            font-size: 13.5px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--gold-dark);
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e6d5b8;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            background: #fffcf5;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--gold-primary);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        /* Voice Recorder Box Styling */
        .recorder-box {
            background: #fff8eb;
            border: 1px dashed var(--gold-primary);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
        }

        .rec-btn {
            background: #d81b60;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            font-weight: 500;
            transition: transform 0.2s;
        }
        .rec-btn:hover {
            transform: scale(1.03);
        }
        .rec-btn.recording {
            background: #c62828;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: var(--white);
            border: none;
            padding: 14px 20px;
            width: 100%;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
        }

        .success-msg {
            color: #2e7d32;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Promesse Éternelle</h1>
        <div class="subtitle">
            Thank you for being part of our special day and celebrating with us! ❤️ <br>
            Please share the pictures you captured or leave a warm message for the couple below. ✨
        </div>
        
        <form id="memoryForm">
            <div class="form-group">
                <label>Your Name / Family Name</label>
                <input type="text" id="guestName" required placeholder="e.g., Chloe or Mom & Dad">
            </div>
            
            <div class="form-group">
                <label>Your Wishes / Message</label>
                <textarea id="guestMessage" placeholder="Write your heartfelt wishes here..."></textarea>
            </div>

            <div class="form-group">
                <label>Record a Voice Note (Optional)</label>
                <div class="recorder-box">
                    <span id="recStatus" style="font-size: 12px; color: #666; display:block; margin-bottom:5px;">Tap to record your voice wishes</span>
                    <button type="button" id="recBtn" class="rec-btn" onclick="toggleRecording()">🎙️ Start Recording</button>
                    <audio id="audioPlayback" controls style="width:100%; margin-top:10px; display:none; border-radius:20px;"></audio>
                </div>
            </div>
            
            <div class="form-group">
                <label>Upload Pictures (Multiple allowed)</label>
                <input type="file" id="guestImages" accept="image/*" multiple>
            </div>
            
            <button type="submit" id="submitBtn" class="btn-submit">Send Memory ✨</button>
            <div class="success-msg" id="successMsg">Thank you! Your memory has been shared successfully 💖</div>
        </form>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: ["AIzaSyAdlmEH", "OHwsnQFcwfUpCNk", "HVCNzYlnoUqw"].join(''),
            authDomain: "promesse-eternele-memories.firebaseapp.com",
            projectId: "promesse-eternele-memories",
            storageBucket: "promesse-eternele-memories.firebasestorage.app",
            messagingSenderId: "142304243061",
            appId: "1:142304243061:web:9faefd4e25106bce6c373c",
            measurementId: "G-QHCZ92NDTZ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;

        // Voice Recorder Logic
        async function toggleRecording() {
            const btn = document.getElementById('recBtn');
            const status = document.getElementById('recStatus');
            const audioPlayback = document.getElementById('audioPlayback');

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

                    mediaRecorder.onstop = () => {
                        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        audioPlayback.src = URL.createObjectURL(recordedAudioBlob);
                        audioPlayback.style.display = 'block';
                        status.innerText = "Voice note ready! ✔";
                    };

                    mediaRecorder.start();
                    btn.innerText = "⏹️ Stop Recording";
                    btn.classList.add("recording");
                    status.innerText = "Recording... Speak now!";
                } catch (err) {
                    alert("Microphone access denied or not supported.");
                }
            } else {
                mediaRecorder.stop();
                btn.innerText = "🎙 Record Again";
                btn.classList.remove("recording");
            }
        }

        // Image Compression helper
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 900;
                        const MAX_HEIGHT = 900;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.65));
                    }
                }
            });
        }

        function blobToBase64(blob) {
            return new Promise((resolve, _) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        // Form Submission to Firestore
        document.getElementById('memoryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Saving memory... Please wait ⏳";
            submitBtn.disabled = true;

            const name = document.getElementById('guestName').value;
            const message = document.getElementById('guestMessage').value;
            const imageInput = document.getElementById('guestImages');

            try {
                let imageUrls = [];
                let audioUrl = "";

                if (imageInput.files && imageInput.files.length > 0) {
                    for (let file of imageInput.files) {
                        const compressedImg = await compressImage(file);
                        imageUrls.push(compressedImg);
                    }
                }

                if (recordedAudioBlob) {
                    audioUrl = await blobToBase64(recordedAudioBlob);
                }

                await db.collection("memories").add({
                    name: name,
                    message: message,
                    images: imageUrls,
                    audio: audioUrl,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('successMsg').style.display = 'block';
                document.getElementById('memoryForm').reset();
                document.getElementById('audioPlayback').style.display = 'none';
                recordedAudioBlob = null;
                submitBtn.innerText = "Send Memory ✨";
                submitBtn.disabled = false;

                setTimeout(() => { document.getElementById('successMsg').style.display = 'none'; }, 5000);

            } catch (error) {
                console.error("Error uploading: ", error);
                alert("Something went wrong. Please try again.");
                submitBtn.innerText = "Send Memory ✨";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
